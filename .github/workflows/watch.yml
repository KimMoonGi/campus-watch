name: campus-watch

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campus-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check campus pages
        env:
          NTFY_TOPIC: haeden-atleti-c1a36d
        run: python3 watch.py
        # DEBUG: set to 1 to print page text in the log
      - name: Save state
        run: |
          git config user.name "campus-watch"
          git config user.email "campus-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
